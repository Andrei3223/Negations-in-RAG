# SubSearch GRPO experiment config.
#
#   python3 -m verl.trainer.main_ppo --config-name subsearch_grpo \
#       data.train_files=... data.val_files=... \
#       actor_rollout_ref.model.path=... retriever.url=... \
#       trainer.default_local_dir=...
#
# Everything that used to live in the 40-line CLI override block of
# train_grpo.sh is declared here, so it is version-controlled, diffable, and
# captured verbatim in the W&B run config. Only genuinely per-run values
# (paths, retriever URL) stay on the command line.
#
# Inspect the composed result without running anything:
#   python3 -m verl.trainer.main_ppo --config-name subsearch_grpo --cfg job --resolve

defaults:
  - ppo_trainer
  - _self_

data:
  train_batch_size: 512
  # 676 = exactly two batches over the 1352-row val set, instead of six at the
  # old 256. Validation is generation-only (no log_prob pass), so the constraint
  # is vLLM's max_num_seqs (1024), not memory -- at 256 the GPUs sat half idle
  # and val_before_train cost ~1.4 h.
  val_batch_size: 676
  max_prompt_length: 4096
  max_response_length: 500
  max_start_length: 2048
  # Left at 1200. Observations are shortened at the source instead, via
  # retriever.topk=2 below: with topk 3 even a single-subquery search returned
  # ~1240 tokens and got clipped, whereas 2 docs (~820) now fit whole. Raising
  # this instead would need max_prompt_length to rise with it -- the rolling
  # window is already over budget at 151 + 4x(response + obs).
  max_obs_length: 1200
  shuffle_train_dataloader: True

algorithm:
  adv_estimator: grpo

actor_rollout_ref:
  model:
    enable_gradient_checkpointing: true
    use_remove_padding: True
  actor:
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.285
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    ppo_mini_batch_size: 256
    # Divided by world size in fsdp_workers.py, so 16 -> 4 sequences per GPU.
    # Sized from measured lengths rather than the worst case I assumed after the
    # OOM: prompt_length/max is 263 and response_length/max is 4096, so a
    # sequence tops out near 4.2k tokens, not the 6.1k I guessed. A 3B Qwen2 has
    # a 151936 vocab and entropy_from_logits materialises softmax(logits) and
    # pd*logits alongside logits, so peak is ~3x tokens*vocab*2B -> 4x4247 tokens
    # is ~14 GiB, inside the ~20 GiB free once vLLM has its 0.6 reservation.
    # This halves the backward passes per step; update_actor was 52% of step time.
    ppo_micro_batch_size: 16
    state_masking: true
    fsdp_config:
      param_offload: true
      grad_offload: true
      optimizer_offload: true
  rollout:
    name: vllm
    n_agent: 5
    temperature: 1
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.6
    # The two log_prob passes batch by token count rather than sequence count.
    # Multi-turn rollouts vary from a few hundred to 6144 tokens, so any fixed
    # sequence count is either wasteful or OOMs on the long tail -- capping
    # tokens bounds the peak at ~7 GiB regardless. Deliberately NOT
    # actor.use_dynamic_bsz: update_policy divides the loss by a precomputed
    # gradient_accumulation (dp_actor.py: ppo_mini // ppo_micro), which is wrong
    # when the micro-batch count varies, so the actor update stays fixed-size.
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 8192
    log_prob_micro_batch_size: 32   # fallback if dynamic bsz is turned off
  ref:
    log_prob_use_dynamic_bsz: true
    log_prob_max_token_len_per_gpu: 8192
    log_prob_micro_batch_size: 32
    fsdp_config:
      param_offload: True

reward_model:
  # The reward actually in force. Previously hardcoded True in main_ppo.py while
  # train_grpo.sh's cosmetic r_answerability="false" claimed otherwise.
  use_answerability: true

max_turns: 4

retriever:
  # 2, not 3. Sent per request and honoured by retrieve_endpoint, so the server
  # needs no restart flag. With up to 3 subqueries per <search>, topk 3 produced
  # ~3700-token observations against a 1200 budget -- two thirds of the retrieved
  # text was clipped before the model or r_answerability ever saw it. At topk 2 a
  # single-subquery search (~820 tok) fits whole and a 2-subquery one (~1650) is
  # close, so far less evidence is discarded, at the cost of retrieval depth.
  topk: 2

trainer:
  project_name: SubSearch
  # Interpolated from the values actually in force, so the run name can no longer
  # disagree with the config the way the old shell-built name did.
  # topk is in the name because the three earlier runs were indistinguishable in
  # the W&B sidebar -- every setting in this string was identical across them.
  experiment_name: nq_hotpot_nevir_negfree-grpo-qwen2.5-3b-ans${reward_model.use_answerability}-a${reward_model.schedule.alpha}-b${reward_model.schedule.beta}-lr${actor_rollout_ref.actor.optim.lr}-topk${retriever.topk}
  logger: ['wandb']
  n_gpus_per_node: 4
  nnodes: 1
  # Checkpoint every 25 steps -- 10 checkpoints over the run. These are for
  # evaluation only: this fork has no load path in ray_trainer.fit(), so a job
  # killed by the wall clock cannot be resumed from one. That is why
  # total_training_steps below has to fit inside a single allocation.
  save_freq: 25
  # Matched to save_freq so every checkpoint has a val score next to it. Costs a
  # validation pass each time, which the val_batch_size bump above pays for.
  test_freq: 25
  total_epochs: 15
  # 250, not 800. Measured step time is ~1.6 h at the old settings and ~1.3 h
  # expected here, so 800 steps would be ~54 days; 250 fits the 14-day wall clock
  # set in run/train.job with margin. total_epochs is not the binding limit.
  total_training_steps: 250
  default_hdfs_dir: null
  # Declared here rather than in ppo_trainer.yaml: the other launch scripts
  # (eval_grpo.sh, train_ppo.sh, scripts/nq_hotpotqa/*) inject these with a `+`
  # prefix, which Hydra rejects if the key already exists in the base config.
  val_only: false
  val_before_train: true
  dirs_exist_ok: false
