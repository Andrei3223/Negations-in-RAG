defaults:
  - ppo_trainer
  - eval/dataset: nevir_with_answers
  - eval/model: searchr1
  - eval/retriever: wiki
  - _self_

# One folder per eval run, shared with the launcher's eval.log. EVAL_RUN_TAG is
# <job-name>-<jobid>, exported by run/eval_negations_with_answers.sh; a bare
# `python3 run/eval.py` falls back to a timestamp.
hydra:
  run:
    dir: eval_logs/${oc.env:EVAL_RUN_TAG,local-${now:%Y%m%d-%H%M%S}}

trainer:
  project_name: Search-R1
  experiment_name: "${dataset_id}-eval-${model_id}"
  logger: []
  n_gpus_per_node: 1
  nnodes: 1
  save_freq: -1
  test_freq: 1
  print_samples: true
  total_epochs: 1
  total_training_steps: 0
  val_only: true
  val_before_train: true
  # Sample at rollout.temperature (1.0), as every eval so far effectively did --
  # the greedy flag used to be dropped in the rollout loop. Repeats (REPS) need it.
  val_do_sample: true
  default_hdfs_dir: null
  default_local_dir: verl_checkpoints/${trainer.experiment_name}

data:
  train_batch_size: 8
  # Score every row, including a short final batch. Safe at n_gpus_per_node: 1.
  val_drop_last: false
  # A dataset group can still pin the batch size via dataset_val_batch_size
  # (_self_ is last, so a plain data.val_batch_size in a group loses to this).
  val_batch_size: ${oc.select:dataset_val_batch_size,50}
  max_prompt_length: 8192
  max_response_length: 1500
  max_start_length: 2048
  max_obs_length: 2048
  shuffle_train_dataloader: false

actor_rollout_ref:
  model:
    enable_gradient_checkpointing: false
    use_remove_padding: true
  actor:
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.0
    use_kl_loss: false
    ppo_mini_batch_size: 8
    ppo_micro_batch_size: 2
    fsdp_config:
      param_offload: false
      grad_offload: false
      optimizer_offload: false
    state_masking: true
  rollout:
    log_prob_micro_batch_size: 4
    tensor_model_parallel_size: 1
    name: vllm
    gpu_memory_utilization: 0.4
    n_agent: 5
    temperature: 1
    top_p: 1.0
  ref:
    log_prob_micro_batch_size: 4
    fsdp_config:
      param_offload: false

algorithm:
  adv_estimator: grpo
  no_think_rl: false

max_turns: 4

reward_model:
  # Log every row's trace and extracted answer (training keeps 1-in-64), so
  # scripts/eval_3x.py can re-score each answer offline, e.g. with BERTScore.
  log_sample_rate: 1
