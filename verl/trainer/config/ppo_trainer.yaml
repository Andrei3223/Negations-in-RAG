data:
  tokenizer: null
  train_files: ~/data/rlhf/gsm8k/train.parquet
  val_files: ~/data/rlhf/gsm8k/test.parquet
  train_data_num: null
  val_data_num: null
  prompt_key: prompt
  max_prompt_length: 512
  max_response_length: 512
  max_start_length: 256
  max_obs_length: 512
  train_batch_size: 1024
  val_batch_size: 1312
  return_raw_input_ids: False  # This should be set to true when the tokenizer between policy and rm differs
  return_raw_chat: False
  shuffle_train_dataloader: True

actor_rollout_ref:
  hybrid_engine: True
  model:
    path: ~/models/deepseek-llm-7b-chat
    external_lib: null
    override_config: { }
    enable_gradient_checkpointing: False
    use_remove_padding: False
  actor:
    strategy: fsdp  # This is for backward-compatibility
    ppo_mini_batch_size: 256
    ppo_micro_batch_size: 64
    use_dynamic_bsz: False
    ppo_max_token_len_per_gpu: 16384 # n * ${data.max_prompt_length} + ${data.max_response_length}
    grad_clip: 1.0
    state_masking: False
    clip_ratio: 0.2
    entropy_coeff: 0.001
    use_kl_loss: False # True for GRPO
    kl_loss_coef: 0.001 # for grpo
    kl_loss_type: low_var_kl # for grpo
    ppo_epochs: 1
    shuffle: False
    ulysses_sequence_parallel_size: 1 # sp size
    optim:
      lr: 1e-6
      lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
      min_lr_ratio: null   # only useful for warmup with cosine
      warmup_style: constant  # select from constant/cosine
      total_training_steps: -1  # must be override by program
    fsdp_config:
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      fsdp_size: -1
  ref:
    fsdp_config:
      param_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    ulysses_sequence_parallel_size: ${actor_rollout_ref.actor.ulysses_sequence_parallel_size} # sp size
  rollout:
    name: vllm
    temperature: 1.0
    top_k: -1 # 0 for hf rollout, -1 for vllm rollout
    top_p: 0.95
    prompt_length: ${data.max_prompt_length}  # not use for opensource
    response_length: ${data.max_response_length}
    # for vllm rollout
    dtype: bfloat16 # should align with FSDP
    gpu_memory_utilization: 0.5
    ignore_eos: False
    enforce_eager: True
    free_cache_engine: True
    load_format: dummy_dtensor
    tensor_model_parallel_size: 2
    max_num_batched_tokens: 8192
    max_num_seqs: 1024
    log_prob_micro_batch_size: 128
    log_prob_use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
    log_prob_max_token_len_per_gpu: ${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}
    # for hf rollout
    do_sample: True
    # number of responses (i.e. num sample times)
    n: 1 # > 1 for grpo
    n_agent: 1 # different here used for agent tasks only

critic:
  strategy: fsdp
  optim:
    lr: 1e-5
    lr_warmup_steps_ratio: 0.  # the total steps will be injected during runtime
    min_lr_ratio: null   # only useful for warmup with cosine
    warmup_style: constant  # select from constant/cosine
    total_training_steps: -1  # must be override by program
  model:
    path: ~/models/deepseek-llm-7b-chat
    tokenizer_path: ${actor_rollout_ref.model.path}
    override_config: { }
    external_lib: ${actor_rollout_ref.model.external_lib}
    enable_gradient_checkpointing: False
    use_remove_padding: False
    fsdp_config:
      param_offload: False
      grad_offload: False
      optimizer_offload: False
      wrap_policy:
        # transformer_layer_cls_to_wrap: None
        min_num_params: 0
      fsdp_size: -1
  ppo_mini_batch_size: ${actor_rollout_ref.actor.ppo_mini_batch_size}
  ppo_micro_batch_size: 64
  forward_micro_batch_size: ${critic.ppo_micro_batch_size}
  use_dynamic_bsz: ${actor_rollout_ref.actor.use_dynamic_bsz}
  ppo_max_token_len_per_gpu: 32768 # (${actor_rollout_ref.actor.ppo_max_token_len_per_gpu}) * 2
  forward_max_token_len_per_gpu: ${critic.ppo_max_token_len_per_gpu}
  ulysses_sequence_parallel_size: 1 # sp size
  ppo_epochs: ${actor_rollout_ref.actor.ppo_epochs}
  shuffle: ${actor_rollout_ref.actor.shuffle}
  grad_clip: 1.0
  cliprange_value: 0.5

reward_model:
  enable: False
  strategy: fsdp
  model:
    input_tokenizer: ${actor_rollout_ref.model.path}  # set this to null if the chat template is identical
    path: ~/models/FsfairX-LLaMA3-RM-v0.1
    external_lib: ${actor_rollout_ref.model.external_lib}
    use_remove_padding: False
    fsdp_config:
      min_num_params: 0
      param_offload: False
  micro_batch_size: 64
  max_length: null
  ulysses_sequence_parallel_size: 1 # sp size
  use_dynamic_bsz: ${critic.use_dynamic_bsz}
  forward_max_token_len_per_gpu: ${critic.forward_max_token_len_per_gpu}

  # ---------------------------------------------------------------------------
  # Rule-based reward, read by verl/trainer/main_ppo.py. Everything below used to
  # be hardcoded in main_ppo.py / qa_em.py; the values here are exactly what that
  # code already used, so lifting them into config changes no scores. They are
  # here so they are CLI-overridable and land in the W&B run config (ray_trainer
  # passes the resolved config to wandb.init).
  #
  # NOTE: the four *_score keys below were previously 0 and dead -- nothing in
  # main_ppo.py read them. They now carry main_ppo.py's real values. The only
  # other reader is main_ppo_format.py, and its callers
  # (scripts/nq_hotpotqa/v0.3/train_{grpo,ppo}_format.sh) override the first
  # three on the CLI, so they are unaffected.
  # ---------------------------------------------------------------------------
  structure_format_score: 0.2
  final_format_score: 0.1
  retrieval_score: 0.1
  decomposition_bonus: 0.0  # bonus for using decomposition when it helps

  # Train reward = EM + answerability + decomposition; validation stays plain EM
  # (no format shaping) so val numbers remain comparable across reward configs.
  # These two are NOT symmetric -- collapsing them into one key would start
  # applying format shaping to validation and shift every val EM number.
  use_answerability: true
  val_use_answerability: false
  add_format: true
  val_add_format: false

  num_examine: 0        # reasoning traces printed per data source, train
  val_num_examine: 1    # ... and validation

  method: strict
  format_score: 0.0
  score: 1.0

  # r_intermediate = w_ans * r_answerability + w_dec * r_decomposition
  intermediate:
    answerability_weight: 0.5
    decomposition_weight: 0.5

  # alpha/beta scheduling for the intermediate reward bonus.
  schedule:
    alpha: 0.8
    beta: 0.2
    alpha_warmup_steps: 200
    scheduler_type: smart   # smart | linear
    beta_decay_steps: 2000
    min_beta: 0.02
    adaptive_beta: true
    ema_decay: 0.98
    target_em: 0.65
    ema_slope_tol: 5e-4
    adaptive_rate: 0.2
    max_beta_step: 0.01

  # _score_decomposition weights.
  decomposition:
    coeff_identical_to_parent: 0.85  # cosine sim a single rephrased query should hit
    coeff_coverage: 0.5
    coeff_dissimilar: 0.5

  answerability:
    first_k: 3  # docs scored per subquery

  judge:
    model_name: sentence-transformers/all-MiniLM-L12-v2
    device: cpu
    threshold: 0.35
    batch_size: 32

  log_sample_rate: 64  # 1-in-N sampling for reward trace prints

  data_sources:
    - nq
    - triviaqa
    - popqa
    - hotpotqa
    - 2wikimultihopqa
    - musique
    - bamboogle
    # negation-focused splits of combined_nq_hotpot_nevir_negfree_upsampled
    - nevir-with-answers
    - negations-free-sentence-with-answer

retriever:
  url: "http://127.0.0.1:8000/retrieve"
  topk: 3

algorithm:
  gamma: 1.0
  lam: 1.0
  adv_estimator: gae
  no_think_rl: False
  kl_penalty: kl  # how to estimate kl divergence
  kl_ctrl:
    type: fixed
    kl_coef: 0.001
  state_masking:
    start_state_marker: "<information>"
    end_state_marker: "</information>"

trainer:
  total_epochs: 30
  total_training_steps: null
  project_name: verl_examples
  experiment_name: gsm8k
  logger: [ 'console', 'wandb' ]
  nnodes: 1
  n_gpus_per_node: 8
  save_freq: -1
  test_freq: -1
  critic_warmup: 0
  default_hdfs_dir: ~/experiments/gsm8k/ppo/${trainer.experiment_name}
  default_local_dir: checkpoints/${trainer.project_name}/${trainer.experiment_name}

max_turns: 10
do_search: true
# Paired validation metrics for negation minimal-pair datasets, computed in
# verl/trainer/ppo/negation_metrics.py (ported from the `main` branch).
negation:
  # Sources whose rows carry extra_info.pair_id + query_role (q1/q2). For these,
  # _validate also logs val/per_instance_acc (both queries of a pair correct),
  # val/n_pairs, and val/{positive,negated}_{score,f1}.
  pair_sources:
    - nevir
    - nevir-with-answers
    - exclusir
    - negations-free-with-answer
    - negations-free-sentence-with-answer
    - negation-controlled-with-answers
    - gpt4o-negation-controlled
    - gpt4o-negation-free
  # Sources where q1 is the NEGATED query; in every other pair source it is q2.
  # Per source rather than main's single global swap_q_roles, because both
  # conventions share one val set. Verified on the combined decomposed val:
  #   negations-free-sentence-with-answer  q1 negated (24 pairs vs 1)
  #   nevir-with-answers                   q2 negated (44 pairs vs 17)
  # The remaining negations-free / negation-controlled / gpt4o entries follow
  # main's documented convention (swap_q_roles=true for those) and were not
  # re-checked against data; exclusir keeps main's default (q2).
  q1_negated_sources:
    - negations-free-with-answer
    - negations-free-sentence-with-answer
    - negation-controlled-with-answers
    - gpt4o-negation-controlled
    - gpt4o-negation-free
